<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
<title>大龙乡红色文化旅游路线图</title>
<style>
:root{--red:#C41E3A;--red-dark:#8B1A2B;--gold:#D4A843;--gold-light:#E8D5A3;--bg:#1a1410;--panel:#231f1a;--card:#2a2318;--border:#3a2a1a;--text:#E8DCC8;--text-dim:#9a8c7a;--text-muted:#6a5c4a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

.topbar{background:linear-gradient(180deg,#2a1410,#1e1008);border-bottom:2px solid var(--red);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:250}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-icon{font-size:1.4rem}
.topbar h1{font-size:clamp(1rem,2.5vw,1.3rem);color:var(--gold);letter-spacing:3px;font-weight:800}
.topbar h1 .sub{display:block;font-size:.65rem;color:var(--text-dim);letter-spacing:2px;font-weight:400;margin-top:2px}
.topbar-right{display:flex;gap:8px;align-items:center}
.topbar-badge{font-size:.65rem;color:var(--gold-light);background:rgba(196,30,58,.2);border:1px solid var(--red);padding:3px 10px;border-radius:12px;letter-spacing:2px;white-space:nowrap}
.btn{border:none;cursor:pointer;font-size:.75rem;padding:6px 14px;border-radius:16px;font-weight:600;letter-spacing:1px;transition:all .2s;white-space:nowrap;font-family:inherit}
.btn-outline{background:transparent;color:var(--gold-light);border:1px solid var(--gold)}
.btn-outline:hover{background:rgba(212,168,67,.15)}
.btn-red{background:var(--red);color:#fff;border:1px solid var(--red)}
.btn-red:hover{background:var(--red-dark)}
.btn-green{background:#2d6a2d;color:#fff;border:1px solid #3a8a3a}

.main-layout{display:flex;max-width:1400px;margin:0 auto;min-height:calc(100vh - 120px)}
.map-col{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:16px}
.sidebar-col{width:340px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 120px);position:sticky;top:60px;background:var(--panel)}

.map-container{position:relative;width:100%;max-width:750px;aspect-ratio:1/1;background-image:url(map.jpg);background-size:contain;background-repeat:no-repeat;background-position:center;border:2px solid var(--border);border-radius:6px;box-shadow:0 4px 40px rgba(0,0,0,.5),0 0 0 1px rgba(196,30,58,.15)}
.route-line{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.route-line path{fill:none;stroke:var(--gold);stroke-width:1.4;stroke-dasharray:3 2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.65;animation:route-flow 30s linear infinite;vector-effect:non-scaling-stroke}
@keyframes route-flow{to{stroke-dashoffset:-260}}
.map-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(26,20,16,.85);color:var(--gold);padding:6px 16px;border-radius:16px;font-size:.7rem;letter-spacing:2px;pointer-events:none;z-index:5;border:1px solid var(--border);animation:pulse-text 2s infinite}
@keyframes pulse-text{0%,100%{opacity:.7}50%{opacity:1}}

.hotspot{position:absolute;width:32px;height:32px;background:var(--red);border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.hotspot .num{color:#fff;font-size:.65rem;font-weight:800;pointer-events:none}
.hotspot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(196,30,58,.3);animation:pulse-ring 2.5s infinite}
.hotspot:hover{transform:translate(-50%,-50%) scale(1.25);background:#e74c3c;box-shadow:0 0 24px rgba(231,76,60,.6);z-index:20}
.hotspot.active{background:var(--gold);border-color:#fff;box-shadow:0 0 30px rgba(212,168,67,.8),0 0 60px rgba(212,168,67,.3);animation:none;z-index:20}
.hotspot.active::after{animation:none;border-color:rgba(212,168,67,.5)}
.hotspot.active .num{color:#1a1410}
.hotspot .tooltip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--card);color:var(--gold);padding:4px 12px;border-radius:4px;font-size:.7rem;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;letter-spacing:1px;border:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.hotspot:hover .tooltip{opacity:1}
@keyframes pulse-ring{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.4);opacity:0}}

.map-legend{position:absolute;bottom:12px;left:12px;background:rgba(26,20,16,.9);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:.65rem;color:var(--text-dim);letter-spacing:1px;pointer-events:none;z-index:5}
.map-legend .legend-item{display:flex;align-items:center;gap:6px;margin:3px 0}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-dot.start{background:#4CAF50}.legend-dot.waypoint{background:var(--red)}.legend-dot.end{background:var(--gold)}
.route-stats{position:absolute;bottom:12px;right:12px;background:rgba(26,20,16,.9);border:1px solid var(--border);border-radius:6px;padding:8px 14px;font-size:.65rem;color:var(--text-dim);letter-spacing:1px;z-index:5;pointer-events:none;text-align:right}
.route-stats .stat-val{color:var(--gold);font-weight:700;font-size:.8rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}

.sidebar-section{padding:14px 16px;border-bottom:1px solid var(--border)}
.sidebar-section:last-child{border-bottom:none}
.sidebar-title{font-size:.75rem;color:var(--gold);letter-spacing:3px;margin-bottom:10px;display:flex;align-items:center;gap:6px}

.route-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;cursor:pointer;transition:all .2s;margin-bottom:4px;border-left:3px solid transparent;animation:slideIn .3s ease forwards;opacity:0}
.route-card:nth-child(1){animation-delay:.05s}.route-card:nth-child(2){animation-delay:.1s}.route-card:nth-child(3){animation-delay:.15s}.route-card:nth-child(4){animation-delay:.2s}.route-card:nth-child(5){animation-delay:.25s}.route-card:nth-child(6){animation-delay:.3s}
.route-card:hover{background:rgba(212,168,67,.08)}
.route-card.active{background:rgba(196,30,58,.12);border-left-color:var(--red)}
.route-card-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0}
.route-card-num.start{background:#4CAF50}.route-card-num.waypoint{background:var(--red)}.route-card-num.end{background:var(--gold);color:#1a1410}
.route-card-info{min-width:0}
.route-card-name{font-size:.85rem;font-weight:700;color:var(--text);letter-spacing:1px}
.route-card-type{font-size:.65rem;color:var(--text-dim);letter-spacing:1px}
.route-card-arrow{margin-left:auto;color:var(--text-muted);font-size:.7rem}

.photo-hint{font-size:.65rem;color:var(--text-muted);text-align:center;padding:6px 0;letter-spacing:1px}

.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--red),var(--gold))}
.timeline-item{position:relative;margin-bottom:12px;font-size:.7rem;color:var(--text-dim);letter-spacing:1px}
.timeline-item::before{content:"";position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.timeline-item:last-child::before{background:var(--gold)}
.timeline-item strong{color:var(--gold);display:block;font-size:.75rem}

.info-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px}
.info-overlay.visible{display:flex}
.info-dialog{background:var(--panel);border-radius:12px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:fadeIn .3s ease}
.info-dialog-header{background:linear-gradient(135deg,#2a1410,#1e1008);padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--red);z-index:1;border-radius:12px 12px 0 0}
.info-dialog-header h2{font-size:1.2rem;color:var(--gold);letter-spacing:3px}
.info-dialog-header .badge-row{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.info-dialog-header .badge{font-size:.6rem;padding:2px 8px;border-radius:10px;letter-spacing:1px}
.badge-red{background:rgba(196,30,58,.3);color:#f08080;border:1px solid var(--red)}
.badge-gold{background:rgba(212,168,67,.2);color:var(--gold-light);border:1px solid var(--gold)}
.badge-green{background:rgba(45,106,45,.3);color:#80d080;border:1px solid #3a8a3a}
.info-dialog-close{background:none;border:none;color:var(--text-dim);font-size:1.5rem;cursor:pointer;padding:0 4px}
.info-dialog-close:hover{color:var(--red)}
.info-dialog-body{padding:20px}
.info-dialog-body .desc{font-size:.9rem;line-height:1.9;color:var(--text);text-align:justify;margin-bottom:16px}

.photo-slider{position:relative;width:100%;aspect-ratio:16/10;background:#0d0a06;border-radius:6px;overflow:hidden;margin-bottom:10px}
.photo-slider-track{display:flex;width:100%;height:100%;transition:transform .5s ease}
.photo-slider-slide{flex:0 0 100%;min-width:100%;width:100%;height:100%;flex-shrink:0;background:#0d0a06;overflow:hidden}
.photo-slider-slide img{width:100%;height:100%;object-fit:contain;display:block}
.photo-slider-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:.8rem;color:var(--text-dim);letter-spacing:2px}
.photo-slider-placeholder .ph-icon{font-size:3rem;opacity:.4}
.photo-slider-placeholder .ph-sub{font-size:.65rem;color:var(--text-muted)}
.photo-slider-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;z-index:5;transition:background .2s}
.photo-slider-arrow:hover{background:rgba(196,30,58,.7)}
.photo-slider-arrow.prev{left:8px}.photo-slider-arrow.next{right:8px}
.photo-slider-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.photo-slider-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.6);cursor:pointer;transition:all .2s}
.photo-slider-dot.active{background:var(--gold);border-color:var(--gold);transform:scale(1.3)}
.photo-slider-counter{position:absolute;top:10px;right:12px;background:rgba(0,0,0,.5);color:#fff;font-size:.65rem;padding:3px 8px;border-radius:10px;letter-spacing:1px;z-index:5}
.photo-slider-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-muted);font-size:.8rem;letter-spacing:2px;pointer-events:none}
.photo-slider-empty .ph-icon{font-size:2.5rem;opacity:.3}

.photo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-bottom:16px}
.photo-thumb{aspect-ratio:4/3;border-radius:4px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .2s;background:#0d0a06;position:relative}
.photo-thumb:hover{border-color:var(--gold);transform:scale(1.03)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb.placeholder{display:flex;align-items:center;justify-content:center;font-size:1.5rem;opacity:.4;cursor:default;border-color:transparent}
.photo-thumb.placeholder:hover{transform:none;border-color:transparent}

.gallery-hint{font-size:.65rem;color:var(--text-muted);text-align:center;padding:4px 0 8px;letter-spacing:1px}

.lightbox{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);align-items:center;justify-content:center;cursor:pointer}
.lightbox.visible{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:4px}
.lightbox-close{position:absolute;top:16px;right:20px;color:#fff;font-size:2rem;cursor:pointer;z-index:1}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:2rem;cursor:pointer;padding:20px;z-index:1;user-select:none}
.lightbox-prev{left:10px}.lightbox-next{right:10px}
.lightbox-counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:.75rem;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:10px}

.ai-section{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
.ai-label{font-size:.7rem;color:var(--text-dim);letter-spacing:2px;margin-bottom:8px}
.ai-btns{display:flex;gap:6px;flex-wrap:wrap}
.ai-btn{font-size:.7rem;padding:5px 12px;background:var(--card);color:var(--text-dim);border:1px solid var(--border);border-radius:12px;cursor:pointer;letter-spacing:1px;transition:all .2s;font-family:inherit}
.ai-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,.08)}
.ai-answer{margin-top:10px;padding:12px 16px;background:var(--card);border-left:3px solid var(--red);border-radius:0 4px 4px 0;font-size:.8rem;line-height:1.7;color:var(--text);display:none;animation:fadeIn .3s ease}
.ai-answer.visible{display:block}
.ai-answer.loading{color:var(--text-dim);font-style:italic}

.mobile-drawer{display:none;position:fixed;bottom:0;left:0;right:0;z-index:150;background:var(--panel);border-top:2px solid var(--red);border-radius:16px 16px 0 0;max-height:55vh;overflow-y:auto;padding:12px 16px 20px;box-shadow:0 -4px 30px rgba(0,0,0,.5);transform:translateY(100%);transition:transform .3s ease}
.mobile-drawer.open{transform:translateY(0)}
.mobile-drawer-handle{width:32px;height:4px;background:var(--text-muted);border-radius:2px;margin:0 auto 10px}
.mobile-drawer h3{font-size:1rem;color:var(--gold);letter-spacing:2px;text-align:center;margin-bottom:8px}
.mobile-photos{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.mobile-photos img{height:100px;border-radius:4px;flex-shrink:0;object-fit:cover}

.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:149;background:rgba(26,20,16,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 4px env(safe-area-inset-bottom,6px)}
.mobile-nav-list{display:flex;gap:4px;overflow-x:auto;padding:0 2px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.mobile-nav-list::-webkit-scrollbar{display:none}
.mobile-nav-item{min-width:72px;padding:6px 8px;text-align:center;border-radius:8px;cursor:pointer;font-size:.6rem;color:var(--text-dim);letter-spacing:1px;border:1px solid transparent;transition:all .2s;scroll-snap-align:start;flex-shrink:0}
.mobile-nav-item.active{border-color:var(--red);background:rgba(196,30,58,.15);color:var(--gold)}
.mobile-nav-item-name{font-weight:700;font-size:.7rem}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--gold);padding:8px 20px;border-radius:20px;font-size:.75rem;letter-spacing:1px;z-index:500;border:1px solid var(--border);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.visible{opacity:1}

.page-footer{text-align:center;padding:12px;color:var(--text-muted);font-size:.6rem;letter-spacing:2px;border-top:1px solid var(--border)}

@media(max-width:900px){
.main-layout{flex-direction:column}
.sidebar-col{display:none}
.map-col{padding:8px}
.map-container{max-width:100%;border-radius:4px}
.map-legend,.route-stats{display:none}
.hotspot{width:26px;height:26px}
.hotspot .num{font-size:.55rem}
.hotspot::after{inset:-4px}
.mobile-nav{display:block}
.mobile-drawer{display:block}
.topbar{padding:8px 12px}
.topbar-badge{display:none}
.topbar h1{font-size:.9rem}
.info-dialog{max-width:100%;max-height:90vh;border-radius:12px 12px 0 0}
.photo-gallery{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:901px){.mobile-nav{display:none}.mobile-drawer{display:none}}

.sub-gallery-section{border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
.sub-gallery-title{font-size:.75rem;color:var(--gold);letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sub-gallery-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sub-gallery-tab{font-size:.68rem;padding:5px 12px;border-radius:14px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text-dim);transition:all .2s;white-space:nowrap}
.sub-gallery-tab:hover{color:var(--gold);border-color:var(--gold)}
.sub-gallery-tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.sub-gallery-photos{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scroll-behavior:smooth}
.sub-gallery-photos img{width:100px;height:70px;object-fit:cover;border-radius:4px;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:all .2s}
.sub-gallery-photos img:hover{border-color:var(--gold);transform:scale(1.05)}
.sub-gallery-desc{font-size:.7rem;color:var(--text-dim);margin-top:8px;line-height:1.6}
@media (max-width:600px){
.sub-gallery-photos img{width:80px;height:56px}
.sub-gallery-tab{font-size:.62rem;padding:4px 8px}
}


.sub-gallery-back{display:inline-block;font-size:.68rem;color:var(--gold);cursor:pointer;margin-bottom:8px;padding:3px 10px;border:1px solid var(--gold);border-radius:12px;transition:all .2s}
.sub-gallery-back:hover{background:rgba(212,168,67,.15);color:#fff}


/* ============ UI 视觉增强（参考 React Bits / Aceternity UI / UI Verse） ============ */
/* 背景光晕 aurora */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(640px 420px at 12% 8%, rgba(196,30,58,.20), transparent 62%),
    radial-gradient(520px 400px at 88% 18%, rgba(212,168,67,.14), transparent 60%),
    radial-gradient(760px 520px at 50% 100%, rgba(45,106,45,.12), transparent 62%);
  animation:aurora 20s ease-in-out infinite alternate;
}
@keyframes aurora{0%{transform:translate(0,0) scale(1)}100%{transform:translate(2%,-2%) scale(1.06)}}

/* 顶栏玻璃拟态 */
.topbar{background:linear-gradient(180deg,rgba(42,20,16,.90),rgba(30,16,8,.86));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar{border-bottom:1px solid rgba(212,168,67,.22);box-shadow:0 8px 32px rgba(0,0,0,.35)}

/* 页面渐入 */
.map-col,.sidebar-col{animation:fadeUp .7s cubic-bezier(.16,1,.3,1) both}
.sidebar-col{animation-delay:.12s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 地图容器发光边框 */
.map-container{border-color:rgba(212,168,67,.28);box-shadow:0 4px 50px rgba(0,0,0,.55),0 0 0 1px rgba(196,30,58,.18),0 0 70px rgba(196,30,58,.10)}

/* 热点发光 + 涟漪 */
.hotspot{box-shadow:0 2px 10px rgba(0,0,0,.5),0 0 0 0 rgba(196,30,58,0)}
.hotspot:hover{transform:translate(-50%,-50%) scale(1.28);box-shadow:0 0 28px rgba(231,76,60,.75),0 0 48px rgba(231,76,60,.28)}
.hotspot.active{animation:hot-glow 1.8s ease-in-out infinite}
@keyframes hot-glow{
  0%,100%{box-shadow:0 0 18px rgba(212,168,67,.65),0 0 38px rgba(212,168,67,.28)}
  50%{box-shadow:0 0 32px rgba(212,168,67,.95),0 0 60px rgba(212,168,67,.45)}
}

/* 按钮 shimmer + 悬浮 */
.btn{position:relative;overflow:hidden}
.btn-red::after{content:"";position:absolute;top:0;left:-150%;width:60%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:btn-shimmer 3.2s infinite}
@keyframes btn-shimmer{0%{left:-150%}55%,100%{left:160%}}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}

/* 对话框玻璃拟态 + 渐变边框 */
.info-dialog{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(212,168,67,.26);box-shadow:0 28px 90px rgba(0,0,0,.65),0 0 0 1px rgba(196,30,58,.10),0 0 70px rgba(196,30,58,.08)}
.info-dialog-header{background:linear-gradient(135deg,rgba(196,30,58,.16),transparent 70%)}
.info-dialog-close{transition:transform .25s ease,color .25s ease}
.info-dialog-close:hover{transform:rotate(90deg) scale(1.15);color:var(--gold)}

/* 图例玻璃拟态 */

    {id:"05",name:"龙安村",short:"古村风情",type:"终点 · 龙安村部",year:"1934",left:"61%",top:"70%",color:"#D4A843",
     desc:"龙安村是泰宁苏区最后一块红色阵地。1934年3月18日，国民党军第十纵队汤恩伯的89师，推进到泰宁城东郊的八里桥。当天夜里，中共泰宁县委、县苏维埃政府撤离县城，转移到梅口区坚持斗争；不久，又从梅口区转移到弋口区。4月间，再迁移至大布区；5月，又撤退到龙安区，建立了龙安区委、区苏和龙安、陈坑、张地、李地等4个乡苏。此后，泰宁县委就以这4个乡，连同原先隶属于梅口区委的善溪、官丘坊、双坪、饶山等4个乡苏为基地，配合主力红军作战，并积极开展以收复县城为目标的游击斗争。1934年夏，国民党军和反动民团3000多人马，进犯龙安苏区，妄图把坚持在龙安苏区的红军、游击队和县苏维埃政府及干部一举“剿灭”。为肃清龙安区周围的地主保卫团，泰宁县游击队频繁出击，给予敌人最坚决的打击。同时，县游击队还不断地深入敌占区，袭击国民党零散部队，不断骚扰敌人的进攻。6月21日，泰宁独立营100余人，由龙安出发，袭击官江口之敌，击毙南乡保卫团队长1人、团丁1人；27日上午，独立营袭击弋口邓家坊华光庙，与保卫团、大刀会激战4小时，击溃保卫团几百人，缴枪数十支；7月2日晚，独立营由南洋潭钉竹筏渡过金溪，到江家坪、南洋岗和将乐吴地一带游击，10天中击毙保卫团近百人。游击队、独立营连续不断的胜利，鼓舞了苏区人民战胜敌人的信心，而国民党军和保卫团只好龟缩在据点里，不敢轻意出动。\n\n龙安村系原龙安乡所在地，位于泰宁县南部，是革命老区、苏维埃临时政府所在地，距乡政府所在地18公里。",
     photos:["photos/05-龙安村/longan-01.jpg","photos/05-龙安村/longan-02.jpg","photos/05-龙安村/longan-03.jpg","photos/05-龙安村/longan-04.jpg","photos/05-龙安村/longan-05.jpg","photos/05-龙安村/longan-06.jpg","photos/05-龙安村/longan-07.jpg","photos/05-龙安村/longan-08.jpg"]},
    {id:"06",name:"红军崖纪念碑",short:"红军丰碑",type:"纪念地 · 战斗遗址",year:"1934",left:"75.5%",top:"26%",color:"#C41E3A",
     desc:"红军崖位于龙安村。1934年初夏，国民党军和反动民团集中3000多人马，大举进犯龙安苏区，妄图把从县城转移到龙安一带坚持革命斗争的泰宁县委、县苏维埃政府及红军游击队一网打尽。6月26日，县委、县政府机关干部和红军游击队共100多人被敌人团团围困在龙安桥头不远的高山上。敌人开始放火烧山，情况十分危急。年仅15岁的通讯员李火兴与两个班的战士一起坚守阵地，阻击敌人，掩护队伍向建宁方向转移。在阻击任务完成后，为了吸引敌人，让战友们安全撤离险境，已经受伤的李火兴主动要求只身留下拖住敌人。他把敌人引向远处的红石崖，利用一挺机枪、几颗手榴弹和满山的石头，打退了敌人一次又一次的进攻，最后身负重伤，弹尽粮绝，怀抱着机枪毅然跳下红石崖，壮烈牺牲！解放后，龙安人民为了纪念英勇牺牲的红军小战士李火兴，便把“白石崖”改名为“红军崖”，并在崖下建起了烈士纪念碑。",
